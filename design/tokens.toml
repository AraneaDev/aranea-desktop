mode = "dark"

[colors]
accent = "#3bff9e"
accent_secondary = "#7a5cff"
ceremony = "#e6c98a"
selection = "#163326"
muted = "#3a4250"
background = "#08090b"
dark_background = "#050609"
darker_background = "#030405"
lighter_background = "#10151b"
surface = "#0d1116"
surface_raised = "#151c24"
surface_glass = "#0b1016"
surface_highlight = "#24323b"
foreground = "#edf3f6"
dark_foreground = "#8b96a6"
light_foreground = "#c7d0db"
bright_foreground = "#ffffff"
hyprland_active_border = "rgba(3bff9ed0) rgba(7a5cffb0) 45deg"
red = "#ff5f56"
yellow = "#ffbd2e"
orange = "#f5a97f"
green = "#3bff9e"
cyan = "#5ce0c6"
blue = "#5b8cff"
magenta = "#7a5cff"
brown = "#4a4038"
bright_red = "#ff8a80"
bright_yellow = "#ffd166"
bright_green = "#7dffc0"
bright_cyan = "#8ff5df"
bright_blue = "#8fb4ff"
bright_magenta = "#8f75ff"
cursor_shadow = "#15121f"
mark_start = "#8af79c"
mark_mid = "#2cf2b8"
mark_end = "#00e5ff"

[dimensions]
surface_border = "#33424b"
surface_border_alpha = 0.48
surface_shadow_alpha = 0.42

[typography]
secondary_opacity = 0.64

[motion]
feedback_ms = 120
settle_ms = 160
enabled = true
reduced_motion_fallback = "static"

[shell.bar]
background = "#06090d"
background-alpha = 0.82
text = "#edf3f6"
active = "#3bff9e"
scale-with-font = true
size-horizontal = 34
size-vertical = 34

[shell.hyprland]
active-border = "rgba(3bff9ed0) rgba(7a5cffb0) 45deg"
active-border-foreground = "rgba(3bff9ed0) rgba(7a5cffb0) 45deg"

[shell.controls]
normal-color = "#edf3f6"
normal-fill-alpha = 0.025
normal-border = "#edf3f6"
normal-border-width = 1
normal-border-alpha = 0.22
hover-cursor-color = "#edf3f6"
hover-cursor-fill-alpha = 0.08
hover-cursor-border = "#3bff9e"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55
focus-color = "#edf3f6"
focus-fill-alpha = 0.08
focus-border = "#3bff9e"
focus-border-width = 1
focus-border-alpha = 0.55
selected-color = "#edf3f6"
selected-fill-alpha = 0.16
selected-border = "#3bff9e"
selected-border-width = 0
selected-border-alpha = 1.0
pressed-fill-alpha = 0.22
selection-fill-alpha = 0.35

[shell.spacing]
scale = 1.0
scale-with-font = true
control-gap = 8
control-padding-x = 9
control-padding-y = 6
row-gap = 8
label-gap = 6

[shell.font]
# Other sizes derive from the base so desktop text-size preferences scale text.
base-size = 12

[shell.popups]
background = "#0b1016"
background-alpha = 0.97
text = "#edf3f6"
border = "hyprland.active-border"
border-alpha = 1.0

[shell.tooltip]
background = "#0b1016"
background-alpha = 0.98
text = "#edf3f6"
border = "#33424b"
border-alpha = 0.86

[shell.notifications]
background = "#0b1016"
background-alpha = 1.0
text = "#edf3f6"
border = "#33424b"
border-alpha = 0.9
countdown = "#3bff9e"

[shell.launcher]
background = "#0b1016"
background-alpha = 0.98
text = "#edf3f6"
border = "#33424b"
border-alpha = 0.82
scrim = "#06090d"
scrim-alpha = 0.5
selected-background = "#edf3f6"
selected-background-alpha = 0.08
selected-text = "#3bff9e"
selected-border = "hyprland.active-border-foreground"
selected-border-alpha = 0.25

[shell.menu]
background = "#0b1016"
background-alpha = 0.98
text = "#edf3f6"
border = "hyprland.active-border"
border-alpha = 1.0
scrim = "#06090d"
scrim-alpha = 0.5
context-text = "#8b96a6"
tile-background = "#121a20"
footer-text = "#8b96a6"
node-alpha = 0.35
selected-background = "#edf3f6"
selected-background-alpha = 0.08
selected-text = "#3bff9e"
selected-border = "hyprland.active-border-foreground"
selected-border-alpha = 0.25

[shell.polkit]
background = "#0b1016"
background-alpha = 1.0
text = "#edf3f6"
text-error = "#ff5f56"
border = "hyprland.active-border"
border-error = "#ff5f56"
border-alpha = 1.0
scrim = "#06090d"
scrim-alpha = 0.5

[shell.lock]
background = "#06090d"
background-alpha = 0.86
text = "#edf3f6"
placeholder = "#8b96a6"
text-error = "#ff5f56"
border = "#33424b"
border-active = "#3bff9e #7a5cff 0deg"
border-error = "#ff5f56"
border-alpha = 1.0
selection = "#3bff9e"
selection-alpha = 0.45

[shell.image-picker]
scrim = "#06090d"
scrim-alpha = 0.5
text = "#edf3f6"
selected-border = "#3bff9e"
selected-border-alpha = 1.0
unselected-border = "#edf3f6"
unselected-border-alpha = 0.28
