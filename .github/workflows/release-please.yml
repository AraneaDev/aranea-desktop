name: Release Please

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/docs/**'
      - 'tests/**'
      - '**/tests/**'
      - '**/*.test.sh'
      - '.github/**'
      - 'release-please-config.json'
  # release-please only ever runs on a push to master, so a release PR that
  # goes stale, or a run that failed, has no way back without a new commit.
  # This gives it one.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run per branch. A second push cancels the first, because whoever pushed
# again has already answered the question the running job was asked. The runs
# long enough to be overtaken are the expensive ones, so this is worth more
# than the share of runs it cancels suggests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR + tag/release on merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Opens and keeps a Release PR up to date from the conventional commits
      # on master. Merging that PR creates the vX.Y.Z tag and the GitHub
      # Release, and sets release_created=true.
      #
      # RELEASE_PLEASE_TOKEN is used when it exists. GitHub does not start
      # workflows for events raised by the built-in GITHUB_TOKEN, so a Release
      # PR opened with it arrives with no checks on it, and master requires
      # those checks before anything can be merged. A personal access token
      # raises the event as a real account, so CI runs on the Release PR by
      # itself.
      #
      # Without the secret this still works; the Release PR then has to be
      # closed and reopened once to start its checks. See CONTRIBUTING.md.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Everything below runs only on the merge that cut a release. The tag is
      # made with GITHUB_TOKEN, so no tag-triggered workflow would fire; the
      # verification lives here instead. There is nothing to publish, so this
      # checks that what was just released actually works.
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Install validation tools
        if: ${{ steps.release.outputs.release_created }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck libxml2-utils imagemagick ripgrep qt6-declarative-dev qt6-declarative-dev-tools

      - name: Run contract tests
        if: ${{ steps.release.outputs.release_created }}
        run: |
          for test in tests/*.test.sh; do
            bash "$test"
          done

      - name: The released version is the one in theme-manifest.toml
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' theme-manifest.toml)"
          echo "tag: $TAG   theme-manifest.toml: $version"
          [ "$TAG" = "v${version}" ]
