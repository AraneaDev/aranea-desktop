name: Release Please

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**/docs/**"
      - "tests/**"
      - "**/tests/**"
      - "**/*.test.sh"
      - ".github/**"
      - "release-please-config.json"
  # release-please only ever runs on a push to master, so a release PR that
  # goes stale, or a run that failed, has no way back without a new commit.
  # This gives it one.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One run per branch at a time. Runs are queued, never cancelled: a run that
# is tagging a release must finish, and the next push is handled right after.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate as CI, on the commit being released: release-please below
  # only opens or merges into a release (and tags) once this passed.
  verify:
    name: tools/check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes jq libxml2-utils imagemagick librsvg2-bin ripgrep python3 lua5.4
          sudo tools/install-shellcheck
          sudo tools/install-shfmt
          sudo tools/install-actionlint
          npm ci

      - name: Run tools/check
        run: tools/check --skip smoke,qml

  release-please:
    name: Release PR + tag/release on merge
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Opens and keeps a Release PR up to date from the conventional commits
      # on master. Merging that PR creates the vX.Y.Z tag and the GitHub
      # Release, and sets release_created=true.
      #
      # RELEASE_PLEASE_TOKEN is used when it exists. GitHub does not start
      # workflows for events raised by the built-in GITHUB_TOKEN, so a Release
      # PR opened with it arrives with no checks on it, and master requires
      # those checks before anything can be merged. A personal access token
      # raises the event as a real account, so CI runs on the Release PR by
      # itself.
      #
      # Without the secret this still works; the Release PR then has to be
      # closed and reopened once to start its checks. See CONTRIBUTING.md.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # On the merge that cut a release: the tag must match the version in
      # theme-manifest.toml. (tools/check already ran in the verify job.)
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The released version is the one in theme-manifest.toml
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' theme-manifest.toml)"
          echo "tag: $TAG   theme-manifest.toml: $version"
          [ "$TAG" = "v${version}" ]
