name: Browser launch diagnostic
on:
  push:
    branches: [diagnose/screensaver-browser-timeout]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: /usr/bin/chromium
            bus: absent
          - browser: /usr/bin/chromium
            bus: private
          - browser: /opt/google/chrome/chrome
            bus: absent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare identical isolated cursor assertions and retain timeout output
        shell: bash
        env:
          BROWSER_DIAGNOSTIC_BINARY: ${{ matrix.browser }}
          BROWSER_DIAGNOSTIC_BUS: ${{ matrix.bus }}
        run: |
          for attempt in 1 2 3; do
            (
              repo_root="$PWD"
              source tests/lib/sandbox.sh
              echo "Fresh sandbox attempt $attempt: $BROWSER_DIAGNOSTIC_BINARY / $BROWSER_DIAGNOSTIC_BUS"
              if [[ "$BROWSER_DIAGNOSTIC_BUS" == private ]]; then
                dbus-run-session -- python3 "$repo_root/tools/diagnose-browser-launch.py" "$BROWSER_DIAGNOSTIC_BINARY"
              else
                python3 "$repo_root/tools/diagnose-browser-launch.py" "$BROWSER_DIAGNOSTIC_BINARY"
              fi
            )
          done
