name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tools/check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes jq libxml2-utils imagemagick librsvg2-bin ripgrep python3 lua5.4 fontconfig
          # Pinned binaries, the same versions as local development.
          sudo tools/install-shellcheck
          sudo tools/install-shfmt
          sudo tools/install-actionlint
          npm ci

      # Everything that does not depend on the Qt version: Ubuntu's Qt is
      # far older than the Qt 6.12 the QML is formatted and linted with, so
      # QML formatting, qmllint and the runtime smoke test run in the Arch
      # job below (the format stage notes the skipped QML part).
      - name: Run tools/check
        run: tools/check --skip smoke,qml

      - name: Exercise installer profiles
        env:
          OMARCHY_INSTALLER_TEST: "1"
        run: |
          for profile in minimal full no_apps; do
            PATH="$GITHUB_WORKSPACE/tests/fake-bin:$PATH" \
              scripts/install.sh --dry-run --yes --profile "$profile"
          done

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-diagnostics
          if-no-files-found: ignore
          path: coverage/

  check-arch:
    name: QML format, strict QML and smoke (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      # Match the Qt 6.12 desktop supported by the reviewed Omarchy 4.5
      # shell. Pin the whole package set, including matching dependencies.
      - name: Pin the supported Arch toolchain
        run: |
          # Pacman expands these variables when reading the mirror list.
          # shellcheck disable=SC2016
          echo 'Server = https://archive.archlinux.org/repos/2026/10/19/$repo/os/$arch' > /etc/pacman.d/mirrorlist

      # The archive mirror sometimes stalls ("Operation too slow"). Wait out
      # slow transfers and retry; downloaded packages stay in the cache.
      - name: Install packages
        run: |
          for attempt in 1 2 3; do
            pacman -Syyuu --noconfirm --needed --disable-download-timeout git curl jq ripgrep python nodejs npm quickshell qt6-declarative imagemagick librsvg libxml2 lua sway dbus libcap diffutils inotify-tools && exit 0
            echo "Package install attempt $attempt failed; retrying" >&2
            sleep $((attempt * 20))
          done
          exit 1

      # Arch's sway carries cap_sys_nice as a file capability, and a container
      # that may not grant it cannot exec sway at all ("Operation not
      # permitted"). The headless smoke compositor does not need it.
      - name: Let sway run in the container
        run: setcap -r /usr/bin/sway

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The container runs as root on a workspace owned by the runner user.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Omarchy's shell sources at the tag in .omarchy-version: the Commons
      # and Ui modules the plugins import.
      - name: Fetch the Omarchy shell
        run: git clone --depth 1 --branch "$(cat .omarchy-version)" https://github.com/basecamp/omarchy "$RUNNER_TEMP/omarchy"

      - name: Install JS tooling and shfmt
        run: |
          npm ci
          tools/install-shfmt /usr/local/bin

      # QML formatting, strict QML against the shrink-only baseline and the
      # runtime smoke test, with the pinned Qt toolchain; skipping is not allowed.
      # The Omarchy path is built from $RUNNER_TEMP here: in container jobs
      # ${{ runner.temp }} is the host path, not the container's.
      - name: QML format, strict QML and runtime smoke
        env:
          ARANEA_CHECK_REQUIRE_ALL: "1"
        run: ARANEA_QML_SHELL_DIR="$RUNNER_TEMP/omarchy/shell" tools/check --only format,qml,qmltest,smoke

      # Native flows require the same pinned Quickshell/Omarchy host as QML.
      # The Ubuntu job retains their headless checks and reports native skips.
      - name: Native project and agent acceptance
        env:
          ARANEA_CHECK_REQUIRE_ALL: "1"
        run: ARANEA_QML_SHELL_DIR="$RUNNER_TEMP/omarchy/shell" tests/run agent-activity-flow project-actions-flow projects-cli-owner projects-flow plugin-reload plugin-reload-host showcase
