name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tools/check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes jq libxml2-utils imagemagick python3 lua5.4 qt6-declarative-dev qt6-declarative-dev-tools
          # Pinned binaries, the same versions as local development.
          sudo tools/install-shellcheck
          sudo tools/install-shfmt
          sudo tools/install-actionlint
          npm ci

      # Everything but the runtime smoke test, which needs Quickshell and a
      # Wayland compositor (the Arch job below). QML is linted bare here:
      # only syntax errors can fail without Omarchy's Commons/Ui.
      - name: Run tools/check
        run: tools/check --skip smoke

      - name: Exercise installer profiles
        env:
          OMARCHY_INSTALLER_TEST: "1"
        run: |
          for profile in minimal full no_apps; do
            PATH="$GITHUB_WORKSPACE/tests/fake-bin:$PATH" \
              scripts/install.sh --dry-run --yes --profile "$profile"
          done

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-diagnostics
          if-no-files-found: ignore
          path: coverage/

  check-arch:
    name: strict QML and runtime smoke (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install packages
        run: pacman -Syu --noconfirm --needed git jq python nodejs npm quickshell qt6-declarative imagemagick libxml2 lua sway

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The container runs as root on a workspace owned by the runner user.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Omarchy's shell sources at the tag in .omarchy-version: the Commons
      # and Ui modules the plugins import.
      - name: Fetch the Omarchy shell
        run: git clone --depth 1 --branch "$(cat .omarchy-version)" https://github.com/basecamp/omarchy "$RUNNER_TEMP/omarchy"

      - name: Install JS tooling
        run: npm ci

      # Strict QML against the shrink-only baseline and the runtime smoke
      # test; skipping is not allowed here.
      - name: Strict QML and runtime smoke
        env:
          ARANEA_QML_SHELL_DIR: ${{ runner.temp }}/omarchy/shell
          ARANEA_CHECK_REQUIRE_ALL: "1"
        run: tools/check --only qml,smoke
