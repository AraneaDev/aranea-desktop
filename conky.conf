-- Tim Schipper theme — conky system monitor
-- Colors are pulled straight from this theme's colors.toml so it matches
-- the rest of the desktop (neon green accent on near-black).

local iface = (io.popen("ip route show default 2>/dev/null | awk '/default/ {print $5; exit}'"):read("*l")) or "eth0"

conky.config = {
    -- Window — native Wayland layer-shell surface (this build has real
    -- zwlr_layer_shell_v1 support), so it's composited on its own layer and
    -- can never be covered by a toplevel app window, unlike an XWayland
    -- floating window which always renders above tiled apps on Hyprland.
    out_to_wayland        = true,
    own_window            = true,
    -- 'dock'/'panel' route through Wayland single-edge anchor/exclusive-zone
    -- logic, which collapses a corner alignment (top_right) down to just one
    -- edge. 'desktop' skips that and anchors both edges directly, still on
    -- the background layer-shell layer (always below every app window).
    own_window_type       = 'desktop',
    own_window_class        = 'conky',
    -- A quiet smoked-glass backing keeps telemetry legible over the brighter
    -- silk nodes without becoming a second opaque panel on the desktop.
    own_window_colour      = '#080b0f', -- background
    own_window_argb_visual = true,
    own_window_argb_value  = 198,

    background             = false,
    double_buffer          = true,
    update_interval        = 1.5,
    net_avg_samples        = 2,
    cpu_avg_samples        = 2,
    no_buffers             = true,

    -- Placement — top-right corner, shifted further right again.
    alignment              = 'top_right',
    gap_x                  = 8,
    gap_y                  = 24,
    minimum_width          = 195,
    maximum_width          = 195,

    -- Look — the glass surface does the legibility work; a hairline border
    -- gives the panel a deliberate edge without turning it into a card.
    draw_shades            = false,
    draw_outline           = false,
    draw_borders           = true,
    default_border_color   = '#24323b', -- surface_highlight
    border_width           = 1,
    border_inner_margin    = 16,
    border_outer_margin    = 0,
    default_bar_width      = 161, -- 195 minimum_width - 2*16 - 2px border
    default_bar_height     = 5,

    use_xft                = true,
    font                   = 'JetBrainsMono Nerd Font:size=8',

    -- Full theme palette, one color per metric category, so it reads as
    -- part of the theme rather than a flat green-on-everything overlay.
    default_color          = '#d6e0e5', -- softened foreground
    color0                 = '#43e6a0', -- mint           — CPU
    color1                 = '#97a4ad', -- muted          — labels
    color2                 = '#8b94d8', -- lavender-blue   — MEM/SWAP
    color3                 = '#33404a', -- quiet           — separators/bar track
    color4                 = '#7acfc0', -- seafoam        — DISK
    color5                 = '#a28cff', -- violet         — NET
    color6                 = '#d6a483', -- warm clay       — temps/GPU
    color7                 = '#c5d0d5', -- soft light      — TOP/BATTERY
};

local B = 'JetBrainsMono Nerd Font:size=8:bold'
local text = [[
${color0}${font ]] .. B .. [[}${nodename}${font}${alignr}${color1}up ${uptime_short}${color}
${voffset 8}${color3}${hr 1}${color}
${voffset 7}${color0}▍${font ]] .. B .. [[}${color1}CPU${font}${alignr}${color}${cpu cpu0}%  ${color1}ld ${color}${loadavg 1}
${voffset 6}${color0}${cpugraph cpu0 15,161 43e6a0 97a4ad -t}
${voffset 14}${color2}▍${font ]] .. B .. [[}${color1}MEM${font}${alignr}${color}$mem / $memmax
${voffset 8}${color2}${membar}
${voffset 10}${color2}▍${font ]] .. B .. [[}${color1}SWAP${font}${alignr}${color}$swap / $swapmax
${voffset 8}${color2}${swapbar}
${voffset 10}${color4}▍${font ]] .. B .. [[}${color1}DISK /${font}${alignr}${color}${fs_used /} / ${fs_size /}
${voffset 8}${color4}${fs_bar /}
${voffset 9}${color3}${hr 1}${color}
${voffset 7}${color5}▍${font ]] .. B .. [[}${color1}NET IFACE${font}${alignr}${color5}${upspeedf IFACE} KiB/s${color}
${voffset 3}${color1}${alignr}${color5}${downspeedf IFACE} KiB/s${color}
${voffset 9}${color3}${hr 1}${color}
${voffset 7}${color6}▍${font ]] .. B .. [[}${color1}CPU temp${font}${alignr}${color}${execi 5 sensors | awk '/Package id 0/{print $4}'}
${voffset 6}${color6}▍${font ]] .. B .. [[}${color1}GPU${font}${alignr}${color}${execi 5 nvidia-smi --query-gpu=utilization.gpu,temperature.gpu --format=csv,noheader,nounits | awk -F', *' '{print $1"%  "$2"C"}'}
${voffset 9}${color3}${hr 1}${color}
${voffset 7}${color7}▍${font ]] .. B .. [[}${color1}TOP${font}${alignr}${color}${top name 1} ${top cpu 1}%
${voffset 3}${color1} ${top name 2}${alignr}${color}${top cpu 2}%
${voffset 3}${color1} ${top name 3}${alignr}${color}${top cpu 3}%
${voffset 3}${color1} ${top name 4}${alignr}${color}${top cpu 4}%
${voffset 3}${color1} ${top name 5}${alignr}${color}${top cpu 5}%
${voffset 9}${color3}${hr 1}${color}
${if_existing /sys/class/power_supply/BAT1}${voffset 7}${color7}▍${font ]] .. B .. [[}${color1}BATTERY${font}${alignr}${color}${battery_percent BAT1}%
${voffset 8}${color7}${battery_bar 5,159 BAT1}${endif}
${voffset 4}
]]

conky.text = (text:gsub("IFACE", iface))
