<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aranea · Silk-lit structure</title>
    <style>
      @font-face {
        font-family: AraneaKanji;
        src: url("./kanji.woff2") format("woff2");
        font-display: block;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060c0e;
        cursor: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #9cbab2;
        font: 16px system-ui;
        transition: opacity 1s;
        pointer-events: none;
      }
      body[data-ready="true"] #status {
        opacity: 0;
      }
    </style>
    <script src="./dismiss.js" defer></script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="status">Entering the silk chamber…</div>
    <script type="module" src="./scene.mjs"></script>
  </body>
</html>
